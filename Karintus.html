<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday My Love ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    overflow:hidden;
    height:100vh;
    background:linear-gradient(to bottom,#000428,#004e92);
    color:white;
}

h1{
    text-align:center;
    margin-top:20px;
    text-shadow:0 0 15px white;
}

.subtitle{
    text-align:center;
    margin-top:10px;
    font-size:18px;
}

.star{
    position:absolute;
    font-size:35px;
    cursor:pointer;
    animation:twinkle 2s infinite;
}

@keyframes twinkle{
    50%{opacity:.3;}
}

#popup{
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:85%;
    max-width:450px;
    background:rgba(0,0,0,.9);
    padding:25px;
    border-radius:20px;
    text-align:center;
    z-index:1000;
}

#popup button{
    margin-top:15px;
    padding:10px 20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.shooting-star{
    position:absolute;
    width:3px;
    height:120px;
    background:linear-gradient(white,transparent);
    transform:rotate(45deg);
    animation:shoot 2s linear forwards;
}

@keyframes shoot{
    from{
        opacity:1;
        transform:translate(0,0) rotate(45deg);
    }
    to{
        opacity:0;
        transform:translate(-500px,500px) rotate(45deg);
    }
}

.hearts{
    position:absolute;
    font-size:25px;
    animation:floatUp linear forwards;
}

@keyframes floatUp{
    from{
        transform:translateY(100vh);
    }
    to{
        transform:translateY(-120px);
    }
}

#final{
    display:none;
    position:fixed;
    inset:0;
    overflow:auto;
    z-index:999;
    text-align:center;

    background:
    radial-gradient(circle at top,#ff8ac6 0%,transparent 25%),
    radial-gradient(circle at bottom,#7f5cff 0%,transparent 30%),
    linear-gradient(135deg,#050816,#120b2f,#261447);

    animation:bgMove 10s infinite alternate;
}

@keyframes bgMove{
    from{
        background-position:0 0,0 0,0 0;
    }
    to{
        background-position:50px -50px,-50px 50px,0 0;
    }
}

.birthday-container{
    padding:40px 20px;
}

.birthday-title{
    font-size:55px;
    color:white;

    text-shadow:
    0 0 10px #ff8ac6,
    0 0 20px #ff8ac6,
    0 0 40px #ff8ac6,
    0 0 80px #ff8ac6;

    animation:glow 2s infinite alternate;
}

@keyframes glow{
    from{transform:scale(1);}
    to{transform:scale(1.05);}
}

.birthday-subtitle{
    margin-top:15px;
    color:#ffd6e8;
    font-size:28px;
}

#photo{
    width:250px;
    height:250px;
    border-radius:50%;
    object-fit:cover;
    border:6px solid white;
    margin-top:25px;

    box-shadow:
    0 0 20px white,
    0 0 40px #ff8ac6,
    0 0 80px #ff8ac6;

    animation:pulse 2s infinite;
}

@keyframes pulse{
    50%{
        transform:scale(1.05);
    }
}

.love-frame{
    max-width:800px;
    margin:35px auto;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(10px);
    border-radius:25px;
    padding:25px;
    border:1px solid rgba(255,255,255,.2);
}

#loveLetter{
    font-size:22px;
    line-height:1.8;
    white-space:pre-wrap;
}

.sparkle{
    position:fixed;
    pointer-events:none;
    animation:sparkleFloat 3s linear forwards;
}

@keyframes sparkleFloat{
    from{
        opacity:1;
        transform:translateY(0);
    }
    to{
        opacity:0;
        transform:translateY(-120px);
    }
}
</style>
</head>

<body>

<audio id="bgMusic" loop>
    <source src="lagu.mp3" type="audio/mpeg">
</audio>

<h1>🌙 Night Sky 🌙</h1>
<p class="subtitle">
Klik semua bintang dan temukan pesan rahasia ❤️
</p>

<div id="popup">
    <h2>✨ Pesan Rahasia ✨</h2>
    <p id="message"></p>
    <button onclick="closePopup()">Tutup</button>
</div>

<div id="final">

    <div class="birthday-container">

        <h1 class="birthday-title">
            🎂 KARINTUS BIRTHDAY 🎂
        </h1>

        <h2 class="birthday-subtitle">
            ✨INPO PARTY✨
        </h2>

        <img id="photo" src="foto.jpg" alt="Foto Pasangan">

        <div class="love-frame">
            <div id="loveLetter"></div>
        </div>

    </div>

</div>

<script>

const messages = [
"❤️ ceeeek ceeeek oiiiiiiiiiii karintussss.",
"🌹 Cieeeeeee ada yg tambah umur nieeeeeee",
"✨ infooooooooooooo party minimal maximal inpo traktiran laaah.",
"💖 Apaaalaaah jangan pelit-pelit.",
"🎁 Cepat bagiii jaaajaaaan jangan laaama!"
];

let found = 0;

for(let i=0;i<5;i++){

    let star = document.createElement("div");

    star.className = "star";
    star.innerHTML = "⭐";

    star.style.left = Math.random()*90 + "vw";
    star.style.top = Math.random()*80 + "vh";

    star.onclick = function(){

        document.getElementById("message").innerText = messages[i];
        document.getElementById("popup").style.display = "block";

        star.remove();

        found++;

        if(found === 5){
            setTimeout(showFinal,1000);
        }
    };

    document.body.appendChild(star);
}

function closePopup(){
    document.getElementById("popup").style.display="none";
}

function createShootingStar(){

    let star=document.createElement("div");

    star.className="shooting-star";

    star.style.left=Math.random()*window.innerWidth+"px";
    star.style.top=Math.random()*300+"px";

    document.body.appendChild(star);

    setTimeout(()=>{
        star.remove();
    },2000);
}

setInterval(createShootingStar,1500);

const text =
`Selamat ulang Taaaahun KARINTUSSSS ❤️

ciiiiiie cieee makin tuaaaa nieeeee.

Panjang umur sehat selalu,semgaaa dengan bertambahnya kaaau pun usiiaaa semua yg kau mimpikaaan semua yg kaaau maaau bisa tercaaapaaaai dengan hasil kerja keras sendiriii ee BROOOO.

AMINNNN YG PALING DAAALAAAM.
Dear mantanmu yg paaaling GACORRRR ❤️`;

function typeLetter(){

    let i = 0;
    let target = document.getElementById("loveLetter");

    let timer = setInterval(()=>{

        target.innerHTML += text.charAt(i);

        i++;

        if(i >= text.length){
            clearInterval(timer);
        }

    },50);
}

function createSparkles(){

    setInterval(()=>{

        let s=document.createElement("div");

        s.className="sparkle";
        s.innerHTML="✨";

        s.style.left=Math.random()*100+"vw";
        s.style.top=Math.random()*100+"vh";
        s.style.fontSize=(Math.random()*20+10)+"px";

        document.body.appendChild(s);

        setTimeout(()=>{
            s.remove();
        },3000);

    },250);
}

function showFinal(){

    document.getElementById("final").style.display="block";

    document.getElementById("bgMusic").play();

    typeLetter();

    createSparkles();

    for(let i=0;i<120;i++){

        let heart=document.createElement("div");

        heart.className="hearts";
        heart.innerHTML="❤️";

        heart.style.left=Math.random()*100+"vw";
        heart.style.animationDuration=(Math.random()*4+4)+"s";

        document.body.appendChild(heart);
    }
}

</script>

</body>
</html>
